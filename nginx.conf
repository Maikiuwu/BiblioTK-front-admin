# nginx sin root (puerto 8080) para servir la app compilada. Detrás del gateway, que quita la
# subruta (/lector/, /bibliotecario/…) antes de pasar la petición
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Archivos con hash en el nombre: pueden quedarse en caché para siempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta de la app devuelve index.html, sin caché para tomar siempre la versión nueva
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
